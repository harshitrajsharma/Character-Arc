<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f7f7fb; color: #16161a; font-family: Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 520px; background: #ffffff; border: 1px solid #e6e6ef; border-radius: 8px; padding: 32px;">
            <tr>
              <td>
                <p style="margin: 0 0 28px; color: #2323ff; font-size: 18px; font-weight: 700;">Ch. Arc</p>
                <h1 style="margin: 0 0 12px; font-size: 26px; line-height: 1.25;">Verify your email</h1>
                <p style="margin: 0 0 24px; color: #61616b; font-size: 16px; line-height: 1.6;">
                  Enter this six-digit code in Character Arc to finish creating your account.
                </p>
                <p style="margin: 0 0 24px; color: #2323ff; font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; letter-spacing: 8px; line-height: 1;">
                  {{ .Token }}
                </p>
                <p style="margin: 0; color: #85858f; font-size: 13px; line-height: 1.6;">
                  If you did not create a Character Arc account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
